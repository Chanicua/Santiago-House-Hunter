<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Casa Quest · Santiago — La Dehesa &amp; Alto Las Condes</title>
  <style>
    :root {
      --bg: #f1f7f6;
      --surface: #ffffff;
      --surface-hover: #e7f2f0;
      --surface-active: #dcf0ec;
      --border: rgba(18, 38, 36, 0.11);
      --border-strong: rgba(18, 38, 36, 0.22);
      --text: #132422;
      --text-secondary: #2e4542;
      --text-muted: #4b6360;
      --accent: #c84422;
      --accent-soft: rgba(200, 68, 34, 0.12);
      --accent-text: #b33818;
      --pool: #0e7490;
      --pool-soft: rgba(14, 116, 144, 0.11);
      --yes: #0f766e;
      --yes-soft: rgba(15, 118, 110, 0.12);
      --no: #be123c;
      --no-soft: rgba(190, 18, 60, 0.10);
      --sun: #92400e;
      --sun-soft: rgba(217, 119, 6, 0.14);
      --ref-pin: #c84422;
      --shadow-sm: 0 2px 6px rgba(18, 38, 36, 0.06);
      --shadow-md: 0 10px 28px rgba(18, 38, 36, 0.12);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      color-scheme: light;
    }

    html.dark {
      --bg: #121918;
      --surface: #1a2422;
      --surface-hover: #222f2d;
      --surface-active: #273835;
      --border: rgba(236, 245, 243, 0.11);
      --border-strong: rgba(236, 245, 243, 0.20);
      --text: #edf5f3;
      --text-secondary: #c4d6d3;
      --text-muted: #98b0ac;
      --accent: #c84422;
      --accent-soft: rgba(255, 140, 107, 0.16);
      --accent-text: #ff9475;
      --pool: #22d3ee;
      --pool-soft: rgba(34, 211, 238, 0.14);
      --yes: #34d399;
      --yes-soft: rgba(52, 211, 153, 0.14);
      --no: #fb7185;
      --no-soft: rgba(251, 113, 133, 0.14);
      --sun: #fbbf24;
      --sun-soft: rgba(251, 191, 36, 0.15);
      --ref-pin: #ff7a59;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.28);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.42);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }

    ::selection {
      background: var(--accent-soft);
      color: var(--text);
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Nunito", "DM Sans", ui-rounded, ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      caret-color: var(--accent);
    }

    a {
      color: var(--accent-text);
      text-underline-offset: 3px;
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tabular-nums { font-variant-numeric: tabular-nums; }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

    /* App Shell */
    .app-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header */
    .app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 20px;
      padding-bottom: 14px;
      border-bottom: 2px dashed var(--border);
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--sun-soft);
      color: var(--sun);
      white-space: nowrap;
    }

    .brand-subtitle {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .kpi-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      font-size: 0.8125rem;
    }

    .kpi-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .kpi-item + .kpi-item {
      padding-left: 14px;
      border-left: 1px solid var(--border);
    }

    .kpi-label { color: var(--text-muted); font-weight: 500; }
    .kpi-val { font-weight: 800; font-size: 0.9375rem; }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 0.8125rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 120ms var(--ease-out), background-color 140ms var(--ease-out), border-color 140ms var(--ease-out);
    }
    .btn-pill:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Filter Toolbar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      padding: 6px 0 12px;
      border-bottom: 1px solid var(--border);
    }

    .control-input,
    .control-select {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 0.8125rem;
      font-weight: 600;
      transition: border-color 140ms var(--ease-out);
    }
    .control-input:hover,
    .control-select:hover {
      border-color: var(--accent);
    }
    .control-input::placeholder {
      color: var(--text-muted);
      font-weight: 500;
    }
    .search-input {
      width: 215px;
      max-width: 100%;
    }

    .range-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 6px;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .range-group input[type="range"] {
      width: 94px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out);
    }
    .check-pill:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }
    .check-pill input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .sort-select { margin-left: auto; }

    /* Main Workspace Grid */
    .workspace-grid {
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .workspace-grid { grid-template-columns: 1fr; }
      .sort-select { margin-left: 0; }
    }

    @media (max-width: 640px) {
      .app-shell { padding: 12px 14px 20px; }
      .search-input { width: 100%; }
      .kpi-item + .kpi-item { padding-left: 10px; }
      .kpi-strip { gap: 10px; }
    }

    /* Left Column: Map + Inspector */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .map-frame {
      position: relative;
      height: 490px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-sm);
    }

    @media (max-width: 640px) {
      .map-frame { height: 370px; }
    }

    #map-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    #map-canvas:active { cursor: grabbing; }

    .map-overlay-top-left {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 54px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .map-chip {
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out);
    }
    html.dark .map-chip {
      background: rgba(34, 28, 24, 0.90);
    }
    .map-chip:hover { border-color: var(--accent); }
    .map-chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .map-zoom-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .zoom-btn {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 140ms var(--ease-out);
    }
    html.dark .zoom-btn {
      background: rgba(34, 28, 24, 0.90);
    }
    .zoom-btn:hover { border-color: var(--accent); }

    .map-legend {
      position: absolute;
      bottom: 10px;
      left: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }
    html.dark .map-legend {
      background: rgba(34, 28, 24, 0.90);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .map-tooltip {
      position: absolute;
      z-index: 20;
      pointer-events: none;
      max-width: 260px;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      box-shadow: var(--shadow-md);
      font-size: 0.75rem;
    }
    .hidden { display: none !important; }

    /* Inspector Panel */
    .inspector-panel {
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .inspector-empty {
      text-align: center;
      padding: 20px 12px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .inspector-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    @media (max-width: 640px) {
      .inspector-layout { flex-direction: column; }
    }

    .inspector-thumb {
      width: 156px;
      height: 120px;
      object-fit: cover;
      border-radius: var(--radius-md);
      background: var(--surface-hover);
      flex-shrink: 0;
    }
    @media (max-width: 640px) {
      .inspector-thumb { width: 100%; height: 185px; }
    }

    .inspector-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .inspector-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .inspector-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.28;
    }

    .inspector-meta {
      margin-top: 2px;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .inspector-distances {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-text);
    }

    .inspector-price {
      text-align: right;
      flex-shrink: 0;
    }
    .inspector-price-clp {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-text);
    }
    .inspector-price-uf {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .inspector-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 8px 0;
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }
    .inspector-specs strong { color: var(--text); font-weight: 800; }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
    }
    .tag-new { background: var(--yes-soft); color: var(--yes); }
    .tag-pool { background: var(--pool-soft); color: var(--pool); }
    .tag-quincho { background: var(--sun-soft); color: var(--sun); }
    .tag-condo { background: var(--accent-soft); color: var(--accent-text); }
    .tag-service { background: rgba(77, 124, 15, 0.12); color: #3f6212; }
    .tag-furnished { background: rgba(219, 39, 119, 0.12); color: #be185d; }
    html.dark .tag-service { color: #bef264; }
    html.dark .tag-furnished { color: #f9a8d4; }

    .inspector-excerpt {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .inspector-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out);
    }
    .action-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    .action-btn.is-yes {
      background: var(--yes-soft);
      border-color: var(--yes);
      color: var(--yes);
    }
    .action-btn.is-no {
      background: var(--no-soft);
      border-color: var(--no);
      color: var(--no);
    }
    .action-btn.is-visited {
      background: var(--sun-soft);
      border-color: var(--sun);
      color: var(--sun);
    }

    .btn-primary {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 15px;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.8125rem;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 140ms var(--ease-out);
    }
    .btn-primary:hover { opacity: 0.92; }

    .note-input {
      width: 100%;
      min-height: 36px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      font-size: 0.8125rem;
    }
    .note-input:focus {
      border-color: var(--accent);
      outline: none;
    }

    /* Right Column: Triage Tabs + Flat List */
    .listings-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 770px;
    }

    .triage-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
      flex-shrink: 0;
    }

    .triage-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .triage-tab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8125rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out), border-color 140ms var(--ease-out);
    }
    .triage-tab:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    .triage-tab[aria-selected="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-text);
    }
    .triage-tab[data-tab="yes"][aria-selected="true"] {
      background: var(--yes-soft);
      border-color: var(--yes);
      color: var(--yes);
    }
    .triage-tab[data-tab="no"][aria-selected="true"] {
      background: var(--no-soft);
      border-color: var(--no);
      color: var(--no);
    }

    .triage-count {
      font-size: 0.75rem;
      opacity: 0.85;
    }

    .mark-seen-btn {
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
    }
    .mark-seen-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .listings-scroll {
      overflow-y: auto;
      flex: 1;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .listing-row {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
      transition: background-color 140ms var(--ease-out);
    }
    .listing-row:last-child { border-bottom: none; }
    .listing-row.is-unseen {
      background: rgba(200, 68, 34, 0.045);
    }
    .listing-row:hover { background: var(--surface-hover); }
    .listing-row.is-selected {
      background: var(--surface-active);
      box-shadow: inset 4px 0 0 var(--accent);
    }

    .listing-main {
      flex: 1;
      min-width: 0;
      text-align: left;
      background: transparent;
      border: none;
      padding: 12px 10px 12px 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
    }

    .listing-quick-actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px 10px 4px;
      flex-shrink: 0;
    }

    .quick-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: transform 120ms var(--ease-out), background-color 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out);
    }
    .quick-btn:hover { transform: scale(1.06); }
    .quick-btn.yes:hover,
    .quick-btn.yes[aria-pressed="true"] {
      background: var(--yes-soft);
      border-color: var(--yes);
      color: var(--yes);
    }
    .quick-btn.no:hover,
    .quick-btn.no[aria-pressed="true"] {
      background: var(--no-soft);
      border-color: var(--no);
      color: var(--no);
    }

    .unseen-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      display: inline-block;
    }

    .listing-thumb {
      width: 84px;
      height: 84px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--surface-hover);
      flex-shrink: 0;
    }

    .listing-thumb-empty {
      width: 84px;
      height: 84px;
      border-radius: var(--radius-sm);
      background: var(--surface-hover);

      flex-direction: column;

    }

    .listing-top {

      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .listing-title {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .listing-price {
      font-size: 0.875rem;
      font-weight: 800;
      color: var(--accent-text);

    }

    .listing-zone {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .listing-specs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);

    .listing-note {
      margin-top: 2px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--sun);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      padding: 36px 20px;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }

    /* Mobile-only helper elements (hidden on desktop) */
    .mobile-filter-toggle {
      display: none;
    }
    .mobile-sheet-header {
      display: none;
    }
    .mobile-sheet-backdrop {
      display: none;
    }
    .mobile-bottom-nav {
      display: none;
    }

    @media (hover: none) {
      .btn-pill:hover,
      .quick-btn:hover {
        transform: none;
      }
      .btn-pill:active,
      .quick-btn:active,
      .action-btn:active,
      .map-chip:active,
      .zoom-btn:active {
        transform: scale(0.96);
      }
    }

    @media (pointer: coarse) {
      .btn-pill,
      .control-input,
      .control-select,
      .check-pill,
      .action-btn,
      .btn-primary,
      .map-chip,
      .triage-tab,
      .mark-seen-btn {
        min-height: 44px;
      }
      .zoom-btn,
      .quick-btn {
        width: 44px;
        height: 44px;
      }
    }

    @media (max-width: 1024px) {
      .app-shell {
        padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(86px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        gap: 10px;
      }

      /* Switch between List and Map cleanly on mobile/tablet */
      body.mobile-view-list .left-col .map-frame,
      body.mobile-view-list .left-col .map-legend {
        display: none;
      }
      body.mobile-view-map .listings-panel {
        display: none;
      }
      body.mobile-view-map .map-frame {
        height: max(360px, calc(100dvh - 255px));
      }

      /* Let list scroll natively with page on mobile */
      .listings-panel {
        max-height: none;
      }
      .listings-scroll {
        overflow-y: visible;
      }

      /* Slide-up Inspector Bottom Sheet on mobile/tablet */
      .mobile-sheet-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(12, 20, 19, 0.48);
        z-index: 40;
      }
      body.sheet-open .mobile-sheet-backdrop {
        display: block;
      }

      .inspector-panel {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        max-height: 84dvh;
        overflow-y: auto;
        border-radius: 20px 20px 0 0;
        padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
        box-shadow: var(--shadow-md);
      }
      body.sheet-open .inspector-panel {
        display: block;
      }

      .mobile-sheet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--border);
      }
      .mobile-sheet-title {
        font-size: 0.8125rem;
        font-weight: 800;
        color: var(--text-muted);
      }
      .mobile-sheet-close {

        min-width: 36px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--border-strong);
        background: var(--surface-hover);
        color: var(--text);
        font-size: 0.8125rem;
        font-weight: 700;
        cursor: pointer;
      }

      /* Fixed Bottom Navigation Bar (thumbs-first) */
      .mobile-bottom-nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 35;
        background: var(--surface);
        border-top: 1px solid var(--border-strong);
        padding: 6px max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
        box-shadow: 0 -4px 16px rgba(18, 38, 36, 0.08);
      }

      .mobile-nav-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-height: 48px;
        border: none;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-muted);
        font-size: 0.72rem;
        font-weight: 700;
        cursor: pointer;
      }
      .mobile-nav-btn[aria-current="page"],
      .mobile-nav-btn[aria-pressed="true"] {
        color: var(--accent-text);
        background: var(--accent-soft);
      }
    }

    @media (max-width: 767px) {
      .app-header {
        gap: 8px;
        padding-bottom: 10px;
      }
      .brand-title { font-size: 1.15rem; }
      .brand-subtitle { display: none; }
      .header-actions {
        width: 100%;
        justify-content: space-between;
        gap: 8px;
      }
      .kpi-strip {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 2px;
        gap: 10px;
        -webkit-overflow-scrolling: touch;
      }
      .kpi-item { white-space: nowrap; }
      .kpi-item + .kpi-item { padding-left: 10px; }

      /* Prevent iOS Safari auto-zoom on form controls */
      .control-input,
      .control-select,
      .note-input {
        font-size: 16px;
      }

      /* Collapsible Filter Bar on Mobile */
      .filter-bar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding: 4px 0 10px;
      }
      .search-input {
        width: 100%;
        min-height: 44px;
      }
      .mobile-filter-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        font-size: 0.875rem;
        font-weight: 700;
        cursor: pointer;
      }
      .mobile-filter-toggle[aria-expanded="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      .filter-extras {
        grid-column: 1 / -1;
        display: none;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 4px;
      }
      .filter-bar.is-open .filter-extras {
        display: flex;
      }
      .filter-extras .control-select,
      .filter-extras .check-pill {
        flex: 1 1 calc(50% - 4px);
        min-height: 44px;
      }
      .filter-extras .range-group {
        flex: 1 1 100%;
        justify-content: space-between;
        min-height: 44px;
      }
      .filter-extras .range-group input[type="range"] {
        flex: 1;
        width: auto;
      }

      /* Triage bar scrolls smoothly on narrow phones */
      .triage-bar {
        flex-wrap: wrap;
        gap: 8px;
      }
      .triage-tabs {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 2px;
        -webkit-overflow-scrolling: touch;
      }
      .triage-tab {
        white-space: nowrap;
        min-height: 40px;
      }
      .mark-seen-btn {
        min-height: 36px;
      }

      /* Bigger tap area on listing rows */
      .listing-main {
        padding: 12px 8px 12px 12px;
      }
      .listing-quick-actions {
        padding: 10px 10px 10px 4px;
        gap: 8px;
      }
      .quick-btn {
        width: 44px;
        height: 44px;
      }

      /* Full-width primary action on mobile sheet */
      .inspector-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .inspector-actions .action-btn,
      .inspector-actions .btn-primary {
        justify-content: center;
        min-height: 44px;
        margin-left: 0;
      }
      .inspector-actions .btn-primary {
        grid-column: 1 / -1;
      }
    }

    @media (min-width: 768px) {
      .filter-extras {
        display: contents;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>

<body class="mobile-view-list">
  <div class="app-shell">

    <!-- Header & KPIs -->
    <header class="app-header">

      <div class="header-actions">

        <button id="btn-theme" type="button" class="btn-pill" aria-label="Toggle light or dark theme" title="Switch between sunlit and night mode">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>

      return /\bhoy\b|\bayer\b|\bhace\s+\d+\s*(m|min|h|hr|hora|horas)\b|\bhace\s+1\s*d\b/.test(pub);
    }

    function setTrack(id, patch) {
      tracker[id] = { ...getTrack(id), ...patch, updatedAt: new Date().toISOString() };
      saveTracker();
      renderAll();
    }

    function setDecision(id, decision) {
      const cur = getDecision(id);
      const nextStatus = cur === decision ? "none" : decision;
      const prevTabItems = activeTab === "review" ? getFilteredListings("review") : [];
      tracker[id] = { ...getTrack(id), status: nextStatus, seen: true, updatedAt: new Date().toISOString() };
      saveTracker();

      if (activeTab === "review" && nextStatus !== "none" && mapState.selectedId === id) {
        const idx = prevTabItems.findIndex((x) => x.id === id);
        const nextItem = prevTabItems[idx + 1] || prevTabItems[idx - 1] || null;
        mapState.selectedId = nextItem ? nextItem.id : null;
        if (nextItem) {
          tracker[nextItem.id] = { ...getTrack(nextItem.id), seen: true };
          saveTracker();
        }
      }
      renderAll();
    }

    function markAllVisibleSeen() {
      const items = getFilteredListings();
      const now = new Date().toISOString();
      items.forEach((item) => {
        tracker[item.id] = { ...getTrack(item.id), seen: true, updatedAt: now };
      });
      saveTracker();
      renderAll();
    }

    function esc(str) {
      return String(str ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[ch]));
    }

    // Theme initialization & toggle (default: sunlit light mode)
    const themeBtn = document.getElementById("btn-theme");
    const themeLabel = document.getElementById("theme-label");
    function applyTheme(mode) {
      document.documentElement.classList.toggle("dark", mode === "dark");
      themeLabel.textContent = mode === "dark" ? "Sunlit" : "Night";
      try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
      if (typeof drawMap === "function") drawMap();
    }
    try {
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme === "dark") applyTheme("dark");
    } catch (e) {}
    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
      applyTheme(next);
    });

    // Formatters & distance helper
    const fmtCLP = (n) => "$" + Math.round(n).toLocaleString("es-CL");
    const fmtShortCLP = (n) => "$" + (n / 1e6).toFixed(2).replace(/\.00$/, "") + "M";

    function kmBetween(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Subtitle
    const dt = PAYLOAD.generated_at ? new Date(PAYLOAD.generated_at).toLocaleString() : "Today";
    document.getElementById("meta-subtitle").textContent =
      `Updated ${dt} · UF = ${fmtCLP(PAYLOAD.uf_clp || 41364)} · Sources: TOCTOC & PortalInmobiliario`;

    // Key References (Colegio Newland & Alto Las Condes) + Secondary Landmarks
    const NEWLAND = { name: "Colegio Newland", lat: -33.3638, lon: -70.5258, featured: true };
    const ALTO_LC = { name: "Alto Las Condes", lat: -33.3905, lon: -70.5465, featured: true };

    const LANDMARKS = [
      NEWLAND,
      ALTO_LC,
      { name: "Portal La Dehesa", lat: -33.3575, lon: -70.5145, featured: false },
      { name: "Mall Sport", lat: -33.3805, lon: -70.5335, featured: false },
      { name: "Los Dominicos", lat: -33.4070, lon: -70.5410, featured: false },
      { name: "Golf Lomas La Dehesa", lat: -33.3340, lon: -70.5115, featured: false },
      { name: "San Carlos Apoquindo", lat: -33.4040, lon: -70.5060, featured: false },
      { name: "Los Trapenses", lat: -33.3325, lon: -70.5430, featured: false }
    ];

    const ROADS = [
      [[-33.405, -70.595], [-33.396, -70.568], [-33.390, -70.546], [-33.381, -70.533], [-33.371, -70.515], [-33.362, -70.485]],
      [[-33.415, -70.595], [-33.408, -70.565], [-33.407, -70.541], [-33.404, -70.506]],
      [[-33.372, -70.519], [-33.357, -70.514], [-33.342, -70.513], [-33.328, -70.520], [-33.332, -70.543]],
      [[-33.405, -70.595], [-33.386, -70.560], [-33.372, -70.525], [-33.364, -70.495], [-33.358, -70.460]],
      [[-33.425, -70.550], [-33.407, -70.548], [-33.390, -70.546]],
      [[-33.425, -70.570], [-33.404, -70.568], [-33.388, -70.566]]
    ];

    const mapState = {
      centerLat: -33.372,
      centerLon: -70.525,
      zoom: 1.0,
      moved: false,
      isPinching: false,
      selectedId: null,
      hoveredId: null
    };

    const canvas = document.getElementById("map-canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawMap();
    }

    function project(lat, lon) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const baseScale = Math.min(w, h) * 8.2 * mapState.zoom;
      const cosLat = Math.cos((mapState.centerLat * Math.PI) / 180);
      const x = w / 2 + (lon - mapState.centerLon) * cosLat * baseScale;
      const y = h / 2 - (lat - mapState.centerLat) * baseScale;
      return { x, y };
    }

    function getFilteredListings(tabOverride) {
      const q = document.getElementById("f-search").value.trim().toLowerCase();
      const zone = document.getElementById("f-zone").value;
      const beds = document.getElementById("f-beds").value;
      const minRooms = parseInt(document.getElementById("f-rooms").value, 10) || 0;
      const maxPrice = parseInt(document.getElementById("f-max-price").value, 10);
      const newOnly = document.getElementById("f-new-only").checked;
      const unseenOnly = document.getElementById("f-unseen-only").checked;
      const poolOnly = document.getElementById("f-pool").checked;
      const condoOnly = document.getElementById("f-condo").checked;
      const sortMode = document.getElementById("f-sort").value;
      const tab = tabOverride || activeTab;

      let out = LISTINGS.filter((item) => {
        const dec = getDecision(item.id);
        if (tab === "review" && dec !== "none") return false;
        if (tab === "yes" && dec !== "yes") return false;
        if (tab === "no" && dec !== "no") return false;

        if (newOnly && !isAddedRecently(item)) return false;
        if (unseenOnly && !isUnseen(item)) return false;
        if (zone !== "all" && item.zone !== zone) return false;
        if (beds !== "all" && item.bedrooms !== parseInt(beds, 10)) return false;
        if ((item.estimated_rooms || 0) < minRooms) return false;
        if (item.price_clp > maxPrice) return false;
        if (poolOnly && !item.has_pool) return false;
        if (condoOnly && !item.is_condominio) return false;

        if (q) {
          const tr = getTrack(item.id);
          const blob = `${item.title} ${item.address} ${item.comuna} ${item.agency} ${tr.note}`.toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });

      out.sort((a, b) => {
        if (sortMode === "unseen_first") {
          const ua = isUnseen(a) ? 1 : 0;
          const ub = isUnseen(b) ? 1 : 0;
          if (ub !== ua) return ub - ua;
          const na = isAddedRecently(a) ? 1 : 0;
          const nb = isAddedRecently(b) ? 1 : 0;
          if (nb !== na) return nb - na;
          return a.price_clp - b.price_clp;
        }
        if (sortMode === "price_asc") return a.price_clp - b.price_clp;
        if (sortMode === "price_desc") return b.price_clp - a.price_clp;
        if (sortMode === "beds_desc") return b.bedrooms - a.bedrooms || a.price_clp - b.price_clp;
        if (sortMode === "m2_desc") return (b.built_m2 || 0) - (a.built_m2 || 0);
        if (sortMode === "rooms_desc") return (b.estimated_rooms || 0) - (a.estimated_rooms || 0);
        return 0;
      });
      return out;
    }

    function drawStar(cx, cy, spikes, outerR, innerR) {
      let rot = (Math.PI / 2) * 3;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerR);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
        rot += step;
      }
      ctx.closePath();
    }

    function drawMap() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;

      const isDark = document.documentElement.classList.contains("dark");
      const bg = isDark ? "#151d1b" : "#e7f0ee";
      const gridColor = isDark ? "rgba(236,245,243,0.06)" : "rgba(18,38,36,0.06)";
      const roadColor = isDark ? "rgba(196,214,211,0.22)" : "rgba(75,99,96,0.28)";
      const textMuted = isDark ? "#98b0ac" : "#4b6360";
      const refColor = isDark ? "#ff7a59" : "#c84422";

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Subtle map grid
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      for (let lat = -33.44; lat <= -33.30; lat += 0.02) {
        const p1 = project(lat, -70.62);
        const p2 = project(lat, -70.43);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
      for (let lon = -70.62; lon <= -70.44; lon += 0.02) {
        const p1 = project(-33.44, lon);
        const p2 = project(-33.30, lon);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }

      // Friendly zone bubbles
      const drawZoneHalo = (lat, lon, label, color) => {
        const p = project(lat, lon);
        const r = 68 * mapState.zoom;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.fillStyle = textMuted;
        ctx.font = "700 11px Nunito, ui-rounded, ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(label, p.x, p.y - r + 16);
      };
      drawZoneHalo(-33.346, -70.514, "LA DEHESA", isDark ? "rgba(34, 211, 238, 0.06)" : "rgba(14, 116, 144, 0.07)");
      drawZoneHalo(-33.395, -70.542, "ALTO LAS CONDES", isDark ? "rgba(255, 140, 107, 0.06)" : "rgba(200, 68, 34, 0.06)");

      // Roads
      ctx.strokeStyle = roadColor;
      ctx.lineWidth = Math.max(1.5, 2 * mapState.zoom);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ROADS.forEach((line) => {
        ctx.beginPath();
        line.forEach(([lat, lon], idx) => {
          const p = project(lat, lon);
          if (idx === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
      });

      // Secondary Landmarks
      LANDMARKS.filter((lm) => !lm.featured).forEach((lm) => {
        const p = project(lm.lat, lm.lon);
        ctx.fillStyle = isDark ? "#a8988b" : "#8c7a6c";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = textMuted;
        ctx.font = "600 10px Nunito, ui-rounded, ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(lm.name, p.x + 6, p.y + 3);
      });

      // Property Pins
      const items = getFilteredListings();
      items.forEach((item) => {
        if (!item.lat || !item.lon) return;
        const p = project(item.lat, item.lon);
        const dec = getDecision(item.id);
        const isSel = item.id === mapState.selectedId;
        const isHov = item.id === mapState.hoveredId;
        const highlightNew = isUnseen(item) || isAddedRecently(item);

        let color = item.has_pool ? (isDark ? "#22d3ee" : "#0e7490") : "#0284c7";
        if (dec === "yes") color = isDark ? "#34d399" : "#0f766e";
        if (dec === "no") color = "#78716c";

        const radius = isSel ? 9.5 : isHov ? 8.5 : 6.5;

        if (highlightNew && dec === "none") {
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius + 3.5, 0, Math.PI * 2);
          ctx.lineWidth = 2;
          ctx.strokeStyle = refColor;
          ctx.stroke();
        }

        if (isSel || isHov) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius + 6, 0, Math.PI * 2);
          ctx.fillStyle = isDark ? "rgba(255, 140, 107, 0.25)" : "rgba(200, 68, 34, 0.20)";
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = isSel ? 2.5 : 1.5;
        ctx.strokeStyle = isDark ? "#181411" : "#ffffff";
        ctx.stroke();

        if (mapState.zoom >= 1.5 || isSel) {
          const lbl = fmtShortCLP(item.price_clp);
          ctx.font = "700 10px ui-monospace, monospace";
          const tw = ctx.measureText(lbl).width + 10;
          ctx.fillStyle = isDark ? "rgba(34,28,24,0.92)" : "rgba(255,255,255,0.95)";
          ctx.fillRect(p.x - tw / 2, p.y - radius - 20, tw, 15);
          ctx.fillStyle = isDark ? "#faf5ef" : "#241a12";
          ctx.textAlign = "center";
          ctx.fillText(lbl, p.x, p.y - radius - 9);
        }
      });

      // Featured References on top: Colegio Newland & Alto Las Condes
      LANDMARKS.filter((lm) => lm.featured).forEach((lm) => {
        const p = project(lm.lat, lm.lon);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 13, 0, Math.PI * 2);
        ctx.fillStyle = isDark ? "rgba(255, 122, 89, 0.20)" : "rgba(200, 68, 34, 0.14)";
        ctx.fill();

        drawStar(p.x, p.y, 5, 8.5, 4);
        ctx.fillStyle = refColor;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = isDark ? "#181411" : "#ffffff";
        ctx.stroke();

        ctx.font = "800 11px Nunito, ui-rounded, ui-sans-serif, system-ui, sans-serif";
        const tw = ctx.measureText(lm.name).width + 12;
        ctx.fillStyle = refColor;
        ctx.beginPath();
        ctx.roundRect(p.x + 10, p.y - 10, tw, 20, 6);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "left";
        ctx.fillText(lm.name, p.x + 16, p.y + 4);
      });
    }

    function findPinAt(mx, my, hitRadius = 16) {
      const items = getFilteredListings();
      let best = null;
      let bestDist = hitRadius;
      for (const item of items) {
        if (!item.lat || !item.lon) continue;
        const p = project(item.lat, item.lon);
        const d = Math.hypot(p.x - mx, p.y - my);
        if (d < bestDist) {
          bestDist = d;
          best = item;
        }
      }
      return best;
    }

    // Multi-touch Pinch-to-Zoom + Pan + Tap using Pointer Events
    const activePointers = new Map();
    let pinchPrev = null;

    function getPinchMetrics() {
      const pts = Array.from(activePointers.values());
      if (pts.length < 2) return null;
      const [a, b] = pts;
      const dist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
      const midX = (a.clientX + b.clientX) / 2;
      const midY = (a.clientY + b.clientY) / 2;
      return { dist, midX, midY };
    }

    canvas.addEventListener("pointerdown", (e) => {
      activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      if (activePointers.size === 1) {
        mapState.moved = false;
      } else if (activePointers.size === 2) {
        mapState.isPinching = true;
        mapState.moved = true;
        pinchPrev = getPinchMetrics();
      }
    });

    canvas.addEventListener("pointermove", (e) => {
      if (activePointers.has(e.pointerId)) {
        const prev = activePointers.get(e.pointerId);
        const dx = e.clientX - prev.clientX;
        const dy = e.clientY - prev.clientY;
        activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

        if (activePointers.size >= 2) {
          const cur = getPinchMetrics();
          if (cur && pinchPrev && pinchPrev.dist > 0) {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            const rect = canvas.getBoundingClientRect();
            const scaleFactor = cur.dist / pinchPrev.dist;
            const oldZoom = mapState.zoom;
            const newZoom = Math.max(0.6, Math.min(8.0, oldZoom * scaleFactor));
            const cosLat = Math.cos((mapState.centerLat * Math.PI) / 180);

            // Anchor zoom around pinch midpoint + pan by midpoint delta
            const mx = cur.midX - rect.left - w / 2;
            const my = cur.midY - rect.top - h / 2;
            const oldScale = Math.min(w, h) * 8.2 * oldZoom;
            const newScale = Math.min(w, h) * 8.2 * newZoom;
            const panDx = cur.midX - pinchPrev.midX;
            const panDy = cur.midY - pinchPrev.midY;

            mapState.centerLon += mx * (1 / (cosLat * oldScale) - 1 / (cosLat * newScale)) - panDx / (cosLat * newScale);
            mapState.centerLat -= my * (1 / oldScale - 1 / newScale) - panDy / newScale;
            mapState.zoom = newZoom;
            drawMap();
          }
          pinchPrev = cur;
          return;
        }

        if (activePointers.size === 1 && !mapState.isPinching) {
          if (Math.hypot(dx, dy) > 3) mapState.moved = true;
          const w = canvas.clientWidth;
          const h = canvas.clientHeight;
          const baseScale = Math.min(w, h) * 8.2 * mapState.zoom;
          const cosLat = Math.cos((mapState.centerLat * Math.PI) / 180);
          mapState.centerLon -= dx / (cosLat * baseScale);
          mapState.centerLat += dy / baseScale;
          drawMap();
          return;
        }
      }

      // Hover tooltip when no pointer is pressed
      if (activePointers.size === 0) {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const hit = findPinAt(mx, my);
        const tt = document.getElementById("map-tooltip");
        if (hit) {
          mapState.hoveredId = hit.id;
          canvas.style.cursor = "pointer";
          tt.classList.remove("hidden");
          tt.style.left = Math.min(mx + 12, rect.width - 265) + "px";
          tt.style.top = Math.max(8, my - 10) + "px";
          tt.innerHTML = `
            <div style="font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(hit.title)}</div>
            <div style="color:var(--text-muted); margin-top:2px;">
              ${fmtCLP(hit.price_clp)} (${esc(hit.price_uf || "-")} UF) · ${hit.bedrooms}D / ${hit.bathrooms}B
              ${hit.has_pool ? " · <span style='color:var(--pool); font-weight:700;'>Pool</span>" : ""}
            </div>
          `;
        } else {
          mapState.hoveredId = null;
          canvas.style.cursor = "grab";
          tt.classList.add("hidden");
        }
        drawMap();
      }
    });

    function endPointer(e) {
      const wasSingleTap = activePointers.size === 1 && !mapState.isPinching && !mapState.moved && e.type === "pointerup";
      activePointers.delete(e.pointerId);
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
      if (activePointers.size < 2) {
        pinchPrev = null;
      }
      if (activePointers.size === 0) {
        if (wasSingleTap) {
          const rect = canvas.getBoundingClientRect();
          const hitRadius = e.pointerType === "touch" ? 26 : 16;
          const hit = findPinAt(e.clientX - rect.left, e.clientY - rect.top, hitRadius);
          if (hit) selectProperty(hit.id, true, true);
        }
        mapState.isPinching = false;
      }
    }
    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);
    canvas.addEventListener("lostpointercapture", (e) => {
      activePointers.delete(e.pointerId);
      if (activePointers.size === 0) {
        pinchPrev = null;
        mapState.isPinching = false;
      }
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.18 : 0.85;
      mapState.zoom = Math.max(0.6, Math.min(8.0, mapState.zoom * factor));
      drawMap();
    }, { passive: false });

    document.getElementById("zoom-in").addEventListener("click", () => {
      mapState.zoom = Math.min(8.0, mapState.zoom * 1.3);
      drawMap();
    });
    document.getElementById("zoom-out").addEventListener("click", () => {
      mapState.zoom = Math.max(0.6, mapState.zoom / 1.3);
      drawMap();
    });

    const jumpBtns = document.querySelectorAll(".map-chip[data-jump]");
    jumpBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        const z = btn.dataset.jump;
        jumpBtns.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
        if (z === "newland") {
          mapState.centerLat = NEWLAND.lat; mapState.centerLon = NEWLAND.lon; mapState.zoom = 1.85;
        } else if (z === "alto_las_condes") {
          mapState.centerLat = ALTO_LC.lat; mapState.centerLon = ALTO_LC.lon; mapState.zoom = 1.85;
        } else {
          mapState.centerLat = -33.372; mapState.centerLon = -70.525; mapState.zoom = 1.0;
        }
        drawMap();
      });
    });

    function isMobileViewport() {
      return window.matchMedia("(max-width: 1024px)").matches;
    }

    function openMobileSheet() {
      if (isMobileViewport()) {
        document.body.classList.add("sheet-open");
      }
    }

    function closeMobileSheet() {
      document.body.classList.remove("sheet-open");
    }

    function setMobileView(view) {
      document.body.classList.toggle("mobile-view-map", view === "map");
      document.body.classList.toggle("mobile-view-list", view !== "map");
      document.querySelectorAll(".mobile-nav-btn[data-mobile-nav]").forEach((btn) => {
        const nav = btn.dataset.mobileNav;
        if (nav === "list" || nav === "map") {
          btn.setAttribute("aria-current", nav === view ? "page" : "false");
        }
      });
      if (view === "map") {
        requestAnimationFrame(resizeCanvas);
      }
    }

    function showSelectedOnMap() {
      closeMobileSheet();
      setMobileView("map");
    }

    function selectProperty(id, markSeen = true, shouldOpenSheet = true) {
      mapState.selectedId = id;
      const item = LISTINGS.find((x) => x.id === id);
      if (markSeen && item) {
        const cur = getTrack(id);
        if (!cur.seen) {
          tracker[id] = { ...cur, seen: true, updatedAt: new Date().toISOString() };
          saveTracker();
        }
      }
      if (item && item.lat && item.lon) {
        mapState.centerLat = item.lat;
        mapState.centerLon = item.lon;
        if (mapState.zoom < 1.5) mapState.zoom = 1.7;
      }
      renderInspector(item);
      renderList();
      drawMap();
      if (shouldOpenSheet && item) {
        openMobileSheet();
      }
    }

    const SVG_CHECK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>`;
    const SVG_NO = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    const SVG_EXT = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

    function renderInspector(item) {
      const box = document.getElementById("inspector");
      if (!item) {
        box.innerHTML = `<div class="inspector-empty">Click any house pin on the map or any card on the right to peek inside!</div>`;
        return;
      }
      const tr = getTrack(item.id);
      const dec = getDecision(item.id);
      const tags = [];
      if (isAddedRecently(item)) tags.push(`<span class="tag tag-new">Fresh (24h)</span>`);
      if (item.has_pool) tags.push(`<span class="tag tag-pool">Pool</span>`);
      if (item.has_quincho) tags.push(`<span class="tag tag-quincho">Quincho</span>`);
      if (item.is_condominio) tags.push(`<span class="tag tag-condo">Condominio</span>`);
      if (item.has_service_room) tags.push(`<span class="tag tag-service">Service Room</span>`);
      if (item.is_furnished) tags.push(`<span class="tag tag-furnished">Furnished</span>`);

      const distNewland = (item.lat && item.lon) ? kmBetween(item.lat, item.lon, NEWLAND.lat, NEWLAND.lon).toFixed(1) : null;
      const distAlto = (item.lat && item.lon) ? kmBetween(item.lat, item.lon, ALTO_LC.lat, ALTO_LC.lon).toFixed(1) : null;

      box.innerHTML = `
        <div class="mobile-sheet-header">
          <span class="mobile-sheet-title">House Peek</span>
          <div style="display:flex; gap:8px;">
            <button type="button" class="mobile-sheet-close" onclick="showSelectedOnMap()">On Map</button>
            <button type="button" class="mobile-sheet-close" aria-label="Close house details" onclick="closeMobileSheet()">Done</button>
          </div>
        </div>
        <div class="inspector-layout">
          ${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.title)}" class="inspector-thumb" onerror="this.style.display='none'" />` : ""}
          <div class="inspector-body">
            <div class="inspector-head">
              <div>
                <h2 class="inspector-title">${esc(item.title)}</h2>
                <div class="inspector-meta">${esc(item.address)} · ${esc(item.source)} (${esc(item.agency)})${item.published_ago ? ` · ${esc(item.published_ago)}` : ""}</div>
              </div>
              <div class="inspector-price">
                <div class="inspector-price-clp tabular-nums">${fmtCLP(item.price_clp)}</div>
                <div class="inspector-price-uf tabular-nums">${esc(item.price_uf || "-")} UF / mo</div>
              </div>
            </div>

            ${(distNewland && distAlto) ? `
              <div class="inspector-distances tabular-nums">
                <span>${distNewland} km to Colegio Newland</span>
                <span>·</span>
                <span>${distAlto} km to Alto Las Condes</span>
              </div>
            ` : ""}

            <div class="inspector-specs tabular-nums">
              <span><strong>${item.bedrooms}</strong> Bedrooms</span>
              <span><strong>${item.bathrooms || "-"}</strong> Baths</span>
              <span><strong>~${item.estimated_rooms}</strong> Total Rooms</span>
              <span><strong>${item.built_m2 ? item.built_m2 + " m²" : "-"}</strong> Built</span>
              ${item.lot_m2 ? `<span><strong>${item.lot_m2} m²</strong> Lot</span>` : ""}
              ${item.parking_spaces ? `<span><strong>${item.parking_spaces}</strong> Parking</span>` : ""}
            </div>

            ${tags.length ? `<div class="tag-row">${tags.join("")}</div>` : ""}
            ${item.description_excerpt ? `<p class="inspector-excerpt">${esc(item.description_excerpt)}</p>` : ""}

            <div class="inspector-actions">
              <button type="button" onclick="setDecision('${esc(item.id)}', 'yes')"
                class="action-btn ${dec === "yes" ? "is-yes" : ""}">
                ${SVG_CHECK}
                ${dec === "yes" ? "Love It! (Yes)" : "Love It (Yes)"}
              </button>
              <button type="button" onclick="setDecision('${esc(item.id)}', 'no')"
                class="action-btn ${dec === "no" ? "is-no" : ""}">
                ${SVG_NO}
                ${dec === "no" ? "Noped (No)" : "Nope (No)"}
              </button>
              <button type="button" onclick="setTrack('${esc(item.id)}', {status: '${tr.status === "visited" ? "yes" : "visited"}', seen: true})"
                class="action-btn ${tr.status === "visited" ? "is-visited" : ""}">
                ${tr.status === "visited" ? "Visited!" : "Mark Visited"}
              </button>
              <a href="${esc(item.url)}" target="_blank" rel="noopener" class="btn-primary">
                Open Listing ${SVG_EXT}
              </a>
            </div>

            <div>
              <input type="text" aria-label="Personal note for ${esc(item.title)}"
                value="${esc(tr.note || "")}"
                placeholder="Jot down a note (e.g., 'Great yard! Visit Tuesday 10am')..."
                onchange="setTrack('${esc(item.id)}', {note: this.value})"
                class="note-input" />
            </div>
          </div>
        </div>
      `;
    }

    function updateMobileFilterBadge() {
      let count = 0;
      if (document.getElementById("f-zone").value !== "all") count++;
      if (document.getElementById("f-beds").value !== "all") count++;
      if (document.getElementById("f-rooms").value !== "0") count++;
      if (parseInt(document.getElementById("f-max-price").value, 10) < 5000000) count++;
      if (document.getElementById("f-new-only").checked) count++;
      if (document.getElementById("f-unseen-only").checked) count++;
      if (document.getElementById("f-pool").checked) count++;
      if (document.getElementById("f-condo").checked) count++;
      const lbl = document.getElementById("mobile-filter-label");
      if (lbl) lbl.textContent = count ? `Filters (${count})` : "Filters";
    }

    function resetFilters() {
      document.getElementById("f-search").value = "";
      document.getElementById("f-zone").value = "all";
      document.getElementById("f-beds").value = "all";
      document.getElementById("f-rooms").value = "0";
      document.getElementById("f-max-price").value = "5000000";
      document.getElementById("f-max-price-lbl").textContent = "$5.0M";
      document.getElementById("f-new-only").checked = false;
      document.getElementById("f-unseen-only").checked = false;
      document.getElementById("f-pool").checked = false;
      document.getElementById("f-condo").checked = false;
      renderAll();
    }

    function renderList() {
      const items = getFilteredListings();
      const reviewItems = getFilteredListings("review");
      const yesItems = getFilteredListings("yes");
      const noItems = getFilteredListings("no");
      const allItems = getFilteredListings("all");
      const container = document.getElementById("listing-cards");

      document.getElementById("tab-count-review").textContent = reviewItems.length;
      document.getElementById("tab-count-yes").textContent = yesItems.length;
      document.getElementById("tab-count-no").textContent = noItems.length;
      document.getElementById("tab-count-all").textContent = allItems.length;

      document.getElementById("kpi-count").textContent = items.length;
      document.getElementById("kpi-new").textContent = LISTINGS.filter((x) => isAddedRecently(x)).length;
      document.getElementById("kpi-unseen").textContent = LISTINGS.filter((x) => isUnseen(x)).length;
      document.getElementById("kpi-yes").textContent = LISTINGS.filter((x) => getDecision(x.id) === "yes").length;
      const avg = items.length ? items.reduce((s, x) => s + x.price_clp, 0) / items.length : 0;
      document.getElementById("kpi-avg").textContent = items.length ? fmtShortCLP(avg) : "-";

      if (!items.length) {
        const emptyMsg = activeTab === "review"
          ? "All caught up! No undecided houses match these filters."
          : activeTab === "yes"
          ? "No houses in Love It! yet. Tap the check button on any house to save it here."
          : activeTab === "no"
          ? "No houses in Nope yet."
          : "No houses match these filters.";
        container.innerHTML = `
          <div class="empty-state">
            <div>${emptyMsg}</div>
            <button type="button" class="btn-pill" onclick="resetFilters()">Reset Filters</button>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map((item) => {
        const tr = getTrack(item.id);
        const dec = getDecision(item.id);
        const isSel = item.id === mapState.selectedId;
        const unseen = isUnseen(item);
        const isNew = isAddedRecently(item);
        const rowCls = [
          "listing-row",
          unseen ? "is-unseen" : "",
          isSel ? "is-selected" : ""
        ].filter(Boolean).join(" ");

        return `
          <div class="${rowCls}">
            <button type="button" class="listing-main" aria-pressed="${isSel}" onclick="selectProperty('${esc(item.id)}', true, true)">
              ${item.image
                ? `<img src="${esc(item.image)}" alt="" class="listing-thumb" loading="lazy" onerror="this.outerHTML='<div class=\\'listing-thumb-empty\\'>No img</div>'" />`
                : `<div class="listing-thumb-empty">No img</div>`}
              <div class="listing-info">
                <div class="listing-top">
                  <div style="display:flex; align-items:center; gap:6px; min-width:0; flex:1;">
                    ${unseen ? `<span class="unseen-dot" title="Not peeked yet"></span>` : ""}
                    <div class="listing-title">${esc(item.title)}</div>
                  </div>
                  <span class="listing-price tabular-nums">${fmtShortCLP(item.price_clp)}</span>
                </div>
                <div class="listing-zone">${esc(item.zone_label)} · ${esc(item.source)}${item.published_ago ? ` · ${esc(item.published_ago)}` : ""}</div>
                <div class="listing-specs tabular-nums">
                  <span>${item.bedrooms}D</span>
                  <span>${item.bathrooms || "-"}B</span>
                  <span>~${item.estimated_rooms} rooms</span>
                  ${item.built_m2 ? `<span>${item.built_m2} m²</span>` : ""}
                  ${isNew ? `<span class="tag tag-new">Fresh</span>` : ""}
                  ${item.has_pool ? `<span class="tag tag-pool">Pool</span>` : ""}
                </div>
                ${tr.note ? `<div class="listing-note">Note: ${esc(tr.note)}</div>` : ""}
              </div>
            </button>
            <div class="listing-quick-actions" aria-label="Quick decision">
              <button type="button" class="quick-btn yes" aria-pressed="${dec === "yes"}" aria-label="Love It (Yes) for ${esc(item.title)}" title="Love It! — move to Yes list" onclick="setDecision('${esc(item.id)}', 'yes')">
                ${SVG_CHECK}
              </button>
              <button type="button" class="quick-btn no" aria-pressed="${dec === "no"}" aria-label="Nope (No) for ${esc(item.title)}" title="Nope — move to No list" onclick="setDecision('${esc(item.id)}', 'no')">
                ${SVG_NO}
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderAll() {
      updateMobileFilterBadge();
      renderList();
      drawMap();
      if (mapState.selectedId) {
        const cur = LISTINGS.find((x) => x.id === mapState.selectedId);
        renderInspector(cur);
      }
    }

    function setActiveTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll(".triage-tab").forEach((b) => {
        b.setAttribute("aria-selected", String(b.dataset.tab === tabName));
      });
      renderAll();
    }

    document.querySelectorAll(".triage-tab").forEach((tabBtn) => {
      tabBtn.addEventListener("click", () => setActiveTab(tabBtn.dataset.tab));
    });

    // Mobile filter drawer toggle
    const filterBarEl = document.getElementById("filter-bar");
    const mobileFilterBtn = document.getElementById("btn-filters-mobile");
    function toggleMobileFilters(forceOpen) {
      const next = typeof forceOpen === "boolean" ? forceOpen : !filterBarEl.classList.contains("is-open");
      filterBarEl.classList.toggle("is-open", next);
      mobileFilterBtn.setAttribute("aria-expanded", String(next));
      const navFilterBtn = document.querySelector(".mobile-nav-btn[data-mobile-nav='filters']");
      if (navFilterBtn) navFilterBtn.setAttribute("aria-pressed", String(next));
    }
    mobileFilterBtn.addEventListener("click", () => toggleMobileFilters());

    // Mobile bottom navigation bar
    document.querySelectorAll(".mobile-nav-btn[data-mobile-nav]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const nav = btn.dataset.mobileNav;
        if (nav === "list") {
          closeMobileSheet();
          setMobileView("list");
          if (activeTab === "yes") setActiveTab("review");
        } else if (nav === "map") {
          closeMobileSheet();
          setMobileView("map");
        } else if (nav === "yes") {
          closeMobileSheet();
          setMobileView("list");
          setActiveTab("yes");
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (nav === "filters") {
          closeMobileSheet();
          toggleMobileFilters();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });
    });

    document.getElementById("sheet-backdrop").addEventListener("click", closeMobileSheet);
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeMobileSheet();
    });

    document.getElementById("btn-mark-seen").addEventListener("click", markAllVisibleSeen);

    ["f-search", "f-zone", "f-beds", "f-rooms", "f-new-only", "f-unseen-only", "f-pool", "f-condo", "f-sort"].forEach((id) => {
      document.getElementById(id).addEventListener("input", renderAll);
      document.getElementById(id).addEventListener("change", renderAll);
    });
    document.getElementById("f-max-price").addEventListener("input", (e) => {
      document.getElementById("f-max-price-lbl").textContent = fmtShortCLP(parseInt(e.target.value, 10));
      renderAll();
    });

    document.getElementById("btn-export").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), tracker }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "santiago_house_tracker.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    window.addEventListener("resize", () => {
      resizeCanvas();
      if (!isMobileViewport()) closeMobileSheet();
    });
    window.addEventListener("themechange", drawMap);
    resizeCanvas();
    renderAll();
    if (LISTINGS.length) {
      selectProperty(LISTINGS[0].id, false, false);
    }
  </script>
</body>
</html>
