name: Daily Santiago House Search (7:00 AM Santiago)

on:
  schedule:
    # 7:00 AM America/Santiago (UTC-3 in summer = 10:00 UTC; adjust to 11:00 UTC in winter)
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search-and-update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily house scraper
        run: python3 scraper.py

      - name: Rebuild interactive map
        run: python3 build_map.py

      - name: Commit updated listings and map
        run: |
          git config user.name "Santiago House Hunter Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json data/history.json data/geocode_cache.json output/map.html
          git diff --staged --quiet || git commit -m "chore: daily house update $(TZ='America/Santiago' date +%Y-%m-%d)"
          git push
